name: ci
on: [push, pull_request]
jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  iac-scan:
    runs-on: ubuntu-latest
    needs: secret-scan # On ne lance l'IaC que si le scan de secrets passe
    steps:
      - uses: actions/checkout@v4
      
      - name: Run Trivy IaC Scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'config'
          scan-ref: './k8s' 
          severity: 'HIGH,CRITICAL'
          exit-code: '1' # Force l'échec du job si des vulnérabilités HIGH ou CRITICAL sont trouvées
          format: 'table'
  build-sign:
    runs-on: ubuntu-latest
    needs: iac-scan
    if: github.event_name == 'push'
    env:
      IMAGE: emnagharbi/weather-api
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build et push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}

      - name: Scan de l'image (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          severity: 'CRITICAL'
          exit-code: '1'
          format: 'table'

      - name: Génération du SBOM (Syft)
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          format: cyclonedx-json
          output-file: sbom.cdx.json
          upload-artifact: false

      - name: Conservation du SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.cdx.json

      - uses: sigstore/cosign-installer@v3

      - name: Signature Cosign (par digest)
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: cosign sign --yes --key env://COSIGN_PRIVATE_KEY ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}

      - name: Vérification Cosign
        run: cosign verify --key cosign.pub ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}