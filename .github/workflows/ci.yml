name: ci
on: [push, pull_request]
jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  iac-scan:
    runs-on: ubuntu-latest
    needs: secret-scan # On ne lance l'IaC que si le scan de secrets passe
    steps:
      - uses: actions/checkout@v4
      
      - name: Run Trivy IaC Scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'config'
          scan-ref: './k8s' 
          severity: 'HIGH,CRITICAL'
          exit-code: '1' # Force l'échec du job si des vulnérabilités HIGH ou CRITICAL sont trouvées
          format: 'table'